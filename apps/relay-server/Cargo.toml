[workspace]
resolver = "2"

members = [
    "crates/relay",
    "crates/y-sweet-core",
    "crates/y-sign",
    "crates/yrs-kvstore",
]

[profile.release]
opt-level = 'z'  # Optimize for size
lto = true       # Enable Link Time Optimization
codegen-units = 1 # Further size optimization
strip = true     # Strip symbols

[patch.crates-io]
rusty-s3 = { git = "https://github.com/dtkav/rusty-s3", branch = "main" }
yrs = { git = "https://github.com/dtkav/y-crdt", rev = "4adcaa62a251bfde5f0ae9b11148413d78d60cd0" }
yrs-kvstore = { path = "crates/yrs-kvstore" }
